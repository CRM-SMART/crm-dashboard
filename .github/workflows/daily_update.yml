name: "Automacao Dashboard GA4"

on:
  schedule:
    # Rodar às 06:00 BRT (09:00 UTC) e 14:00 BRT (17:00 UTC)
    - cron: '0 9,17 * * *'
  workflow_dispatch: # Permite rodar o script manualmente clicando em um botão no GitHub

permissions:
  contents: write

jobs:
  atualizar_dados:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install google-analytics-data

      - name: Criar arquivo de credenciais
        run: |
          echo '${{ secrets.GA4_CREDENTIALS }}' > agente-guanabara-16ba36a165a7.json

      - name: Rodar script de atualização
        run: python update_ga4.py

      - name: Gerar Insights Executivos com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerar_insights.py

      - name: Commit e Push das alterações
        run: |
          git config --global user.name "Robo Dashboard"
          git config --global user.email "robo@dashboard.com"
          git add dados_dashboard.csv
          if [ -f insights_crm.html ]; then
            git add insights_crm.html
          fi
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "⚙️ Auto-update: Extraindo dados atualizados do GA4 e gerando insights de IA"
            git pull --rebase origin main
            git push origin main
          fi
